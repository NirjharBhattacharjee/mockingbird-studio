<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>mockingbird-studio</title>
  <link rel="stylesheet" href="style.css">
  <script src="app.js" defer></script>
</head>
<body>
  <nav aria-label="Projects">
    <button id="jobs-button" type="button" aria-pressed="false">Jobs</button>
    <h2>Projects</h2>
    <ul id="projects"></ul>
  </nav>

  <main>
    <h1 id="heading">Pick a step</h1>
    <p id="decision"></p>
    <div id="preview"></div>
    <div id="files" aria-label="Files"></div>
    <div class="actions">
      <button id="approve" type="button" disabled>Approve</button>
      <button id="redo" type="button" disabled>Redo with a note…</button>
    </div>
    <p id="error" role="alert"></p>
  </main>

  <section id="jobs-page" aria-label="Jobs" hidden>
    <h1>Jobs</h1>
    <ul id="jobs"></ul>
    <h2 id="job-heading">Log</h2>
    <pre id="job-log" tabindex="0"></pre>
    <p id="job-error" role="alert"></p>
  </section>

  <aside aria-label="Notes">
    <h2>Notes</h2>
    <ul id="notes"></ul>
    <form id="note-form">
      <label for="note-text">Note <span id="note-at"></span></label>
      <textarea id="note-text" rows="3" required></textarea>
      <button type="submit">Add a note</button>
    </form>
  </aside>

  <dialog id="redo-dialog">
    <form method="dialog">
      <label for="redo-text">What should change?</label>
      <textarea id="redo-text" rows="4" required></textarea>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="send">Send back</button>
      </div>
    </form>
  </dialog>
  <dialog id="stop-dialog">
    <form method="dialog">
      <p id="stop-text"></p>
      <div class="actions">
        <button value="cancel" formnovalidate>Cancel</button>
        <button value="stop">Stop</button>
      </div>
    </form>
  </dialog>
</body>
</html>
