[package]
name = "studio-core"
description = "Projects, operations, CLI and MCP server for mockingbird-studio. No Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
jiff = { version = "1", features = ["serde"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
toml = "1"
libc = "0.2"
base64 = "0.22"
form_urlencoded = "1"
security-framework = "3"
sha2 = "0.10"
feed-rs = "2"
ureq = { version = "3", default-features = false, features = ["rustls"] }

[dev-dependencies]
tempfile = "3"
