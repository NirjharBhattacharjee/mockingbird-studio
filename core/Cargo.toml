[package]
name = "studio-core"
description = "Projects, operations, CLI and MCP server for mockingbird-studio. No Tauri."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
clap = { version = "4", features = ["derive"] }
jiff = { version = "1", features = ["serde"] }
rmcp = { version = "3", features = ["server", "macros", "transport-io"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "macros", "io-std"] }
toml = "1"

[dev-dependencies]
tempfile = "3"
