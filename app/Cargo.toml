[package]
name = "mockingbird-studio"
description = "The mockingbird-studio binary: arguments go to studio-core, no arguments opens the window."
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[dependencies]
studio-core = { path = "../core" }
serde_json = "1"
tauri = { version = "2", features = ["protocol-asset"] }

[dev-dependencies]
tempfile = "3"

[build-dependencies]
tauri-build = { version = "2", features = [] }
